# Builds the landing page and docs and deploys them to bunny.net
# (bunny sites: storage zone + pull zone, site "deadhop"). Every deploy goes
# live; roll back with `bunny sites deployments publish --previous --force`.
#
# Repository settings:
#   secret   BUNNYNET_API_KEY  bunny.net API key
#   variable SITE_URL          public origin: https://deadhop.run
#                              (canonical links, sitemap, Open Graph, llms.txt)
#
# The deploy ID is the commit's short sha. Rebuilding the live commit with
# different output (e.g. after changing SITE_URL) is refused, so push a commit.
name: site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Deploys serialize and are never cancelled: a cancelled upload would leave a
# half-written deploy directory behind.
concurrency:
  group: bunny-sites
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write # records the deploy in the repo's Environments
    env:
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Require SITE_URL
        run: test -n "$SITE_URL" || { echo "::error::Set the SITE_URL repository variable"; exit 1; }
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Check (links, metadata, llms.txt, sitemap, brand copies)
        run: npm run check
      - uses: BunnyWay/actions/deploy-site@deploy-site_0.1.2
        with:
          site: deadhop
          directory: dist
          api_key: ${{ secrets.BUNNYNET_API_KEY }}
