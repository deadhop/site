# Builds and checks the site on every pull request (deploys happen in site.yml).
# A lone clone skips the check that docs only name settings the source defines;
# that one runs in the deadhop workspace.
name: check

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check
